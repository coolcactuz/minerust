name: Build Artifacts & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-artifacts:
    name: Build Bundle (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            archive_ext: tar.gz
            bin_name: minerust
          - os: windows-latest
            platform: windows
            arch: x86_64
            archive_ext: zip
            bin_name: minerust.exe
          - os: macos-latest
            platform: macos
            arch: arm64
            archive_ext: tar.gz
            bin_name: minerust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Bevy engine)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust dependency cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Build release binary
        run: cargo build --release

      - name: Package bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          SAFE_VERSION=$(echo "$VERSION" | tr '/' '-')
          BUNDLE_NAME="minerust-${SAFE_VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"

          mkdir -p "$BUNDLE_NAME"
          cp "target/release/${{ matrix.bin_name }}" "$BUNDLE_NAME/"
          cp -r assets "$BUNDLE_NAME/"
          cp README.md LICENSE* "$BUNDLE_NAME/" 2>/dev/null || true

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "${BUNDLE_NAME}.zip" "$BUNDLE_NAME"
            echo "ARCHIVE_FILE=${BUNDLE_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czf "${BUNDLE_NAME}.tar.gz" "$BUNDLE_NAME"
            echo "ARCHIVE_FILE=${BUNDLE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_FILE }}
          path: ${{ env.ARCHIVE_FILE }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with bundles
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
