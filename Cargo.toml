[package]
name = "minerust"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"

# Ottimizzazioni raccomandate per Bevy durante lo sviluppo
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Profilo release per massimizzare il framerate e le performance in-game
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
