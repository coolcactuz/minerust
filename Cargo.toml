[package]
name = "minerust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrayvec = "0.7.8"
bevy = "0.19.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.1"
thiserror = "2.0.20"
tracing = "0.1.44"

# Ottimizzazioni raccomandate per Bevy durante lo sviluppo
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Profilo release per massimizzare il framerate e le performance in-game
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
