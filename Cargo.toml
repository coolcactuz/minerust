[package]
name = "minerust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrayvec = "0.7.8"
bevy = "0.19.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.1"
thiserror = "2.0.20"
tracing = "0.1.44"

# Ottimizzazioni raccomandate per Bevy durante lo sviluppo
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Profilo release per massimizzare il framerate e le performance in-game
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "bench_engine"
harness = false

[lints.rust]
unsafe_code = "forbid"
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Domain-justified allowances for ECS / Graphics / Math:
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
inline_always = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow" # Bevy systems receive Res, Commands, Query by value
type_complexity = "allow"        # Bevy ECS query tuples
many_single_char_names = "allow" # 3D voxel math (x, y, z, wx, wy, wz, lx, ly, lz)
struct_excessive_bools = "allow" # DevSettings toggles
unreadable_literal = "allow"    # Hashing constants
needless_range_loop = "allow"   # 2D/3D grid indexing [lx][lz]
if_not_else = "allow"           # Game physics collision branches
redundant_closure_for_method_calls = "allow"
trivially_copy_pass_by_ref = "allow"
collapsible_match = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
unnecessary_map_or = "allow"
uninlined_format_args = "allow"
